<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحوالة المصرفية</title>
    <meta name="description" content="Convert Iraqi Dinar (IQD) to Chinese Yuan (RMB) and calculate 0.3% fee">
    <link rel="stylesheet" href="css/styles.css">
    <!-- Favicon -->
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
        <header>
            <h1>صرف الدينار مقابل اليوان</h1>
            <p class="subtitle">نسبة المصرف</p>
        </header>

        <main>
            <div class="fee-rate-config">
                <div class="fee-rate-display">
                    <span>معدل الرسوم الحالي: <span id="currentFeeRate">0.3</span>%</span>
                    <button type="button" id="editFeeBtn" class="btn-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
                        </svg>
                    </button>
                </div>
                <div id="feeRateEditForm" class="fee-rate-form hidden">
                    <input type="number" id="feeRateInput" min="0" max="100" step="0.1" placeholder="أدخل النسبة المئوية">
                    <div class="fee-edit-buttons">
                        <button type="button" id="saveFeeBtn" class="btn btn-small">حفظ</button>
                        <button type="button" id="cancelFeeBtn" class="btn btn-small btn-secondary">إلغاء</button>
                    </div>
                </div>
            </div>

            <form id="calculator-form" class="calculator">
                <div class="input-group">
                    <label for="iqdAmount">المبلغ بالعراقي:</label>
                    <input 
                        type="text" 
                        id="iqdAmount" 
                        name="iqdAmount" 
                        placeholder="إدخال المبلغ بالعراقي" 
                        required 
                        pattern="[0-9,]*"
                        inputmode="numeric"
                        aria-describedby="iqdHelp">
                    <small id="iqdHelp" class="form-text"> </small>
                </div>

                <div class="button-group">
                    <button type="button" id="calculateBtn" class="btn">احسب</button>
                    <button type="reset" class="btn btn-secondary">امسح</button>
                </div>

                <div class="results">
                    <div class="result-group">
                        <label for="feeResult">0.3% عمولة المصرف:</label>
                        <input type="text" id="feeResult" readonly aria-live="polite">
                    </div>
                    
                    <div class="result-group">
                        <label for="rmbResult">القيمة باليوان (¥):</label>
                        <input type="text" id="rmbResult" readonly aria-live="polite">
                    </div>
                </div>
            </form>
        </main>

        <footer>
            <div class="footer-content">
                <div class="footer-logo">
                    <img src="assets/Tahadi_vertical_logo@3x.png" alt="Tahadi Logo" class="footer-image">
                </div>
                <div class="footer-text">
                    <p>© <span id="current-year"></span> IQD to RMB Calculator</p>
                    <p>Exchange rate: 1 IQD = 0.00548847420417124 RMB</p>
                </div>
            </div>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
